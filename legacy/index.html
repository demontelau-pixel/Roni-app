<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RONI prototype v0.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --outer:#E3E9EB;--bg:#F2F5F4;--surface:#FFFFFF;--ink:#10223A;--muted:#5A6B7C;--line:#E0E7EA;--off:#CBD5DA;
  --primary:#0E7C86;--primary-ink:#FFFFFF;--soft:#DDF1F2;--sun:#FFC857;
  --good:#137A45;--goodbg:#E1F4E9;--warn:#8A5A00;--warnbg:#FFF1CF;--bad:#B4390E;
  --deep:#10223A;--deeptext:#EAF6F4;--fixed:#10223A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --outer:#060D13;--bg:#0B1620;--surface:#132230;--ink:#E8F0F4;--muted:#9BADBB;--line:#243748;--off:#3A4F62;
    --primary:#4CC2CB;--primary-ink:#06222A;--soft:#123840;
    --good:#5FD59A;--goodbg:#12362A;--warn:#F2C260;--warnbg:#3A2E10;--bad:#F0855A;
    --deep:#0F3540;--deeptext:#EAF6F4;
  }
}
:root[data-theme="dark"]{
  --outer:#060D13;--bg:#0B1620;--surface:#132230;--ink:#E8F0F4;--muted:#9BADBB;--line:#243748;--off:#3A4F62;
  --primary:#4CC2CB;--primary-ink:#06222A;--soft:#123840;
  --good:#5FD59A;--goodbg:#12362A;--warn:#F2C260;--warnbg:#3A2E10;--bad:#F0855A;
  --deep:#0F3540;--deeptext:#EAF6F4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--outer);color:var(--ink);font:16px/1.45 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.12}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}.small{font-size:13.5px}.xs{font-size:12.5px}
.bold{font-weight:700}
button:focus-visible,input:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--primary);outline-offset:2px}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
main{flex:1;overflow-y:auto;padding:20px 18px 32px;-webkit-overflow-scrolling:touch}
main.ask{padding-bottom:0}
.stack>*+*{margin-top:18px}
.stack-s>*+*{margin-top:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* nav */
nav{display:none;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px;align-items:end}
nav.on{display:grid}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;font-weight:600}
.nb.act{color:var(--primary)}
.nb.ask{margin-top:-30px;color:var(--ink)}
.nb.ask .orbwrap{display:flex;border-radius:50%;box-shadow:0 0 0 5px var(--bg),0 6px 14px rgba(16,34,58,.3)}

/* buttons, chips, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;min-height:48px;border-radius:999px;font-weight:700;background:var(--primary);color:var(--primary-ink);text-align:center}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--soft);color:var(--primary)}
.btn.sun{background:var(--sun);color:var(--fixed)}
.btn.sm{padding:7px 14px;min-height:38px;font-size:14px}
.btn.onDeep{background:transparent;border:1.5px solid rgba(234,246,244,.4);color:var(--deeptext)}
.link{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip svg.i{width:18px;height:18px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--primary)}
.tag.grey{background:var(--line);color:var(--muted)}
.tag.good{background:var(--goodbg);color:var(--good)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.spons{background:var(--warnbg);color:var(--warn)}
.tag svg.i{width:14px;height:14px}
.sw{width:50px;height:30px;border-radius:999px;background:var(--off);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .end{text-align:right;flex:none}
.ico{width:42px;height:42px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.ico.dash{background:transparent;border:1.5px dashed var(--off);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.dot.off{background:var(--off)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--primary);margin-bottom:14px}
.deep{background:var(--deep);color:var(--deeptext);border-radius:22px;padding:20px}
.deep .save{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--sun);line-height:1.1}
.big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1}
.big span{font-size:18px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:6px}
.askbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px}
.askbar input{flex:1;border:0;background:transparent;min-width:0;padding:8px 0;outline:0}
.askbar:focus-within{border-color:var(--primary)}
.sendbtn{width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.field{display:block}
.field span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.notice{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14px}
.notice.warn{background:var(--warnbg);color:var(--warn)}
.hr{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv b{font-weight:600;text-align:right}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:8px}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding-left:22px;position:relative;margin:4px 0}
ul.clean li::before{content:"";position:absolute;left:4px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--primary)}
ul.clean.x li::before{background:var(--bad)}

/* marketplace */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.opt.top{border:2px solid var(--primary)}
.opt.sp{border:1.5px dashed var(--warn)}
.price{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.price small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.tray{position:sticky;bottom:0;margin:16px -18px -32px;padding:12px 18px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th,.tbl td{padding:10px 8px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl th:first-child{color:var(--muted);font-weight:600;width:84px}
.tbl thead th{border-top:0;font-size:15px}
.scrollx{overflow-x:auto;margin:0 -20px;padding:0 20px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15.5px}
.bub.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:6px}
.bub.r{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub .part+.part{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:12.5px;font-weight:700}
.src svg.i{width:13px;height:13px}
.composer{position:sticky;bottom:0;margin:0 -18px;padding:10px 18px 12px;background:var(--bg);border-top:1px solid var(--line)}
.typing{display:flex;gap:5px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* sheets and toast */
#sheet-root .scrim{position:absolute;inset:0;background:rgba(8,16,26,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 20px 28px;animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:4px;background:var(--off);margin:0 auto 16px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:40;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.quote{border-left:4px solid var(--primary);background:var(--bg);padding:12px 14px;border-radius:0 12px 12px 0;font-style:italic;font-size:15px}
.step{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--muted)}
.step.done{color:var(--ink)}
.step .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--off);display:grid;place-items:center;flex:none}
.step.done .ck{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.step .ck svg.i{width:14px;height:14px;stroke-width:3}
.drop{border:2px dashed var(--off);border-radius:20px;padding:26px 16px;text-align:center;display:block;cursor:pointer}
.drop:hover{border-color:var(--primary)}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.wtitle{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v0.2 additions ---------- */
.panel,.opt{box-shadow:0 1px 2px rgba(16,34,58,.05),0 8px 22px rgba(16,34,58,.05)}
.wrap{max-width:760px;margin:0 auto}
.fade{animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brand{display:none}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:118px;position:relative;box-shadow:0 1px 2px rgba(16,34,58,.05),0 8px 22px rgba(16,34,58,.05);transition:transform .15s,border-color .15s}
.catcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.catcard.soon{opacity:.6;box-shadow:none}
.catcard.soon:hover{transform:none;border-color:var(--line)}
.catcard .tag{position:absolute;top:12px;right:12px}
.askbig{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:12px 12px 12px 16px;box-shadow:0 8px 22px rgba(16,34,58,.07)}
.askbig input{flex:1;border:0;background:transparent;min-width:0;padding:10px 0;font-size:17px;outline:0}
.askbig:focus-within{border-color:var(--primary)}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -18px;padding:0 18px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.tab{padding:10px 12px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--primary);border-color:var(--primary)}
.ext{border-left:4px solid var(--primary);background:var(--surface);border-radius:0 16px 16px 0;padding:14px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gen{border:1.5px dashed var(--off);background:transparent;border-radius:16px;padding:14px 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.stackbar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;margin-top:14px}
.stackbar i{display:block;height:100%}
.attr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}
.attr:first-child{border-top:0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl>div{position:relative;padding-bottom:14px}
.tl>div::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.btn.sm.wide{flex:1}
.filebtn{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;font-weight:700;cursor:pointer}
.filebtn:hover{border-color:var(--primary)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:3px solid var(--primary);outline-offset:2px}
.mini{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;flex:none}
.mini.rec{background:var(--bad);color:#fff}

@media (min-width:900px){
  #app{max-width:1180px;flex-direction:row-reverse}
  main{padding:36px 44px}
  nav{display:none}
  nav.on{display:flex;flex-direction:column;width:236px;border-top:0;border-right:1px solid var(--line);padding:26px 14px;gap:6px;align-items:stretch;justify-content:flex-start}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.02em;padding:0 12px 22px}
  .nb{flex-direction:row;font-size:15.5px;gap:12px;padding:12px 14px;border-radius:14px;justify-content:flex-start}
  .nb.act{background:var(--soft)}
  .nb.ask{margin-top:0;order:-1;background:var(--sun);color:var(--fixed);margin-bottom:10px}
  .nb.ask .orbwrap{box-shadow:none}
  .nb.ask .orbwrap svg{width:28px;height:28px}
  .nb.ask.act{background:var(--sun);outline:2px solid var(--ink)}
  .composer{margin:0;padding:10px 0 14px}
  .chips,.seg,.tabs{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
  .cats{grid-template-columns:repeat(4,1fr)}
  .tray{margin:16px 0 -32px;padding-left:0;padding-right:0}
  #toast{bottom:32px}
  .sheet{max-width:560px;margin:0 auto;border-radius:24px;margin-bottom:5vh}
  #sheet-root .scrim{align-items:center;justify-content:center}
}

.rrow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:96%}
.rrow>svg{flex:none}
.rrow .bub.r{align-self:auto;max-width:none}
.hero{flex:none;filter:drop-shadow(0 8px 14px rgba(16,34,58,.18))}

.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
textarea.inp{resize:vertical}
.rrow>img{flex:none}
@media (min-width:900px){.nb.ask .orbwrap img{width:28px;height:28px}}
</style>
</head>
<body>
<div id="app">
  <main id="screen"></main>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
/* ---------- helpers ---------- */
const TODAY = new Date('2026-10-11T00:00:00Z'); // fixed so demo numbers stay consistent (Dec 14 = 64 days)
const days = d => Math.round((new Date(d + 'T00:00:00Z') - TODAY) / 864e5);
const fdate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
const $$ = n => '$' + Number(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pgl = p => /^\d+$/.test(String(p)) ? 'page ' + p : p;
const clone = o => JSON.parse(JSON.stringify(o));

const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  market:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  car:'<path d="M5 16l1.5-6A2 2 0 0 1 8.4 8.5h7.2a2 2 0 0 1 1.9 1.5L19 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="18" r=".6"/><circle cx="16.5" cy="18" r=".6"/>',
  building:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  paw:'<circle cx="7" cy="10" r="1.6"/><circle cx="12" cy="7" r="1.6"/><circle cx="17" cy="10" r="1.6"/><path d="M12 12c-3 0-5 3-4 5.5 1 2 2.5 1.5 4 1.5s3 .5 4-1.5c1-2.5-1-5.5-4-5.5z"/>',
  moto:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1-2H7"/>',
  plane:'<path d="M3 13l8-2 5-7 2 1-3 7 5 2-1 2-6-1-3 5-2-1 1-6-6 1z"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',

let POLICY_TPL = [], SAMPLES = [], FLOW = {}, DEFAULTS = {}, CATALOG = {}, OPTIONS = {}, WATCH = {};
function rebuildCatalog(){
  OPTIONS = {}; WATCH = {};
  Object.keys(CATS).forEach(c => { OPTIONS[c] = []; });
  Object.keys(CATALOG).forEach(c => (CATALOG[c].options || []).forEach(o => {
    if(o.kind === 'watch') (WATCH[c] = WATCH[c] || []).push(o); else (OPTIONS[c] = OPTIONS[c] || []).push(o);
  }));
}

const fullName = () => (S.user.first + ' ' + S.user.last).trim();
function newAccount(){
  const d = clone(DEFAULTS);
  S.profile = d.profile; S.members = d.members; S.needs = d.needs; S.settings = d.settings; S.log = d.log;
  S.policies = clone(POLICY_TPL);

}
const points = () => S.log.reduce((a,l)=>a+l[1],0);
const getP = (cat, own) => S.policies.find(p => p.cat === cat && (own === false || p.owner === 'me'));
const sub = v => String(v).replace('{holder}', fullName());
const fact = (p,l) => { const f = p.facts.find(x=>x[0]===l); return f ? sub(f[1]) : ''; };
const addPoints = (t, n) => { S.log.push([t,n]); toast('+' + n + ' Roni points'); };
const numWord = n => ['no','one','two','three','four','five'][n] || String(n);

function age(dob){
  if(!dob) return 0;
  const d = new Date(dob + 'T00:00:00Z'); if(isNaN(d)) return 0;
  let a = TODAY.getUTCFullYear() - d.getUTCFullYear();
  const m = TODAY.getUTCMonth() - d.getUTCMonth();
  if(m < 0 || (m === 0 && TODAY.getUTCDate() < d.getUTCDate())) a--;
  return a;
}
function tok(t){
  const p = S.profile || {};
  if(t === 'zip') return p.zip || '';
  if(t === 'vehicle') return (p.vehicles || [])[0] || '';
  if(t === 'address') return p.street ? [p.street, p.city, p.state, p.zip].filter(Boolean).join(', ') : '';
  if(t === 'dob') return p.dob ? fdate(p.dob) : '';
  if(t === 'household') return [S.user.first].concat(S.members.filter(m=>m.adult).map(m=>m.name.split(' ')[0])).filter(Boolean).join(' and ');
  if(t === 'driver'){ const a = age(p.dob); return a ? `${fullName()}, age ${a}` : ''; }
  if(t === 'pet') return (p.pets || [])[0] || '';
  return '';
}
function saveTok(t, v){
  v = String(v || '').trim(); if(!v) return;
  const p = S.profile;
  if(t === 'zip') p.zip = v; else if(t === 'vehicle') p.vehicles = [v].concat(p.vehicles || []);
  else if(t === 'address') p.street = v; else if(t === 'dob') p.dob = v; else if(t === 'pet') p.pets = [v].concat(p.pets || []);
}

/* ---------- ranking ---------- */
function rank(cat, prios, sort){
  const pr = prios.length ? prios : ['price'];
  const list = OPTIONS[cat].filter(o => !o.sponsored);
  const norm = (vals, v, inv) => { const mn = Math.min(...vals), mx = Math.max(...vals); const x = mx === mn ? 1 : (v - mn) / (mx - mn); return inv ? 1 - x : x; };
  const P = list.map(o=>o.price), C = list.map(o=>o.cov), D = list.map(o=>o.ded), B = list.map(o=>o.benefits.length);
  const out = list.map(o => {
    const s = {price:norm(P,o.price,true), coverage:norm(C,o.cov,false), deductible:norm(D,o.ded,true), benefits:norm(B,o.benefits.length,false)};
    return Object.assign({}, o, {s, score: pr.reduce((a,k)=>a+s[k],0) / pr.length});
  });
  const by = {match:(a,b)=>b.score-a.score||a.price-b.price, price:(a,b)=>a.price-b.price, coverage:(a,b)=>b.cov-a.cov, benefits:(a,b)=>b.benefits.length-a.benefits.length, deductible:(a,b)=>a.ded-b.ded};
  return out.sort(by[sort || 'match']);
}
function similarOptions(cat){
  const cur = getP(cat); if(!cur) return [];
  const src = WATCH[cat] || OPTIONS[cat].filter(o=>!o.sponsored);
  return src.filter(o => o.cov >= cur.score - 6 && o.price < cur.premium).sort((a,b)=>a.price-b.price);
}
function compareSelection(cat){
  const sim = similarOptions(cat);
  return (sim.length ? sim : rank(cat, ['price'], 'match')).slice(0,3).map(o=>o.id);
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800);
}

const DB = {db:null, user:null, sample:null, uid:null, admin:false, saved:'', walletSaved:'', timer:null, running:false};
const dbPath = n => `data/users/${DB.uid}/${n}`;
function packState(){ return {user:S.user, profile:S.profile, needs:S.needs, settings:S.settings, members:S.members, log:S.log, requests:S.requests, sampleIdx:S.sampleIdx, snooze:S.snooze}; }
function packWallet(){ return {policies:S.policies}; }
function hydrate(d, w){
  S.user = d.user || S.user; S.profile = d.profile || S.profile; S.needs = d.needs || {}; S.settings = Object.assign(S.settings, d.settings || {});
  S.members = d.members || []; S.log = d.log || []; S.requests = d.requests || []; S.sampleIdx = d.sampleIdx || 0; S.snooze = !!d.snooze;
  S.policies = (w && w.policies) || [];
  CAT_KEYS.forEach(c => { if(!S.needs[c]) S.needs[c] = defNeed(); });
}
async function initBackend(){
  try{
    if(typeof claude !== 'undefined'){
      DB.db = await claude.use('db'); DB.user = await claude.use('user'); DB.sample = await claude.use('sample');
    }
  }catch(e){ DB.db = null; }
  if(!DB.db){ S.boot = 'nodb'; render(true); return; }
  try{
    if(DB.user){ DB.uid = await DB.user.id(); DB.admin = !!(await DB.user.canEdit()); }
    const cat = await DB.db.collection('catalog').get();
    const t = await Promise.all(['defaults','wallet','uploads','flows'].map(n => DB.db.doc('templates/' + n).get()));
    cat.docs.forEach(d => { const x = d.data(); if(x && x.cat) CATALOG[x.cat] = x; });
    DEFAULTS = (t[0].data() || {}); POLICY_TPL = ((t[1].data() || {}).policies || []); SAMPLES = ((t[2].data() || {}).samples || []); FLOW = ((t[3].data() || {}).flows || {});
    rebuildCatalog();
    if(DB.uid){
      const pd = await DB.db.doc(dbPath('profile')).get();
      if(pd.exists){
        const wd = await DB.db.doc(dbPath('wallet')).get();
        hydrate(pd.data(), wd.exists ? wd.data() : {policies:[]});
        S.hasAccount = true; DB.saved = JSON.stringify(packState()); DB.walletSaved = JSON.stringify(packWallet());
      }
    }
    S.boot = 'ready';
    if(S.hasAccount && S.screen === 'welcome') S.screen = 'home';
  }catch(e){ S.boot = 'nodb'; }
  render(true);
}
function persistSoon(){ if(!DB.db || !DB.uid || !S.hasAccount) return; clearTimeout(DB.timer); DB.timer = setTimeout(persistNow, 900); }
async function persistNow(){
  if(!DB.db || !DB.uid || !S.hasAccount) return;
  if(DB.running){ DB.timer = setTimeout(persistNow, 600); return; }
  DB.running = true;
  try{
    const a = JSON.stringify(packState()), b = JSON.stringify(packWallet());
    if(a !== DB.saved){ await DB.db.doc(dbPath('profile')).set(JSON.parse(a)); DB.saved = a; }
    if(b !== DB.walletSaved){ await DB.db.doc(dbPath('wallet')).set(JSON.parse(b)); DB.walletSaved = b; }
  }catch(e){ toast('Could not save your changes just now.'); }
  DB.running = false;
}
async function resetAll(){
  try{ if(DB.db && DB.uid){ await DB.db.doc(dbPath('profile')).delete(); await DB.db.doc(dbPath('wallet')).delete(); } }catch(e){}
  S = freshState(); S.boot = 'ready'; DB.saved = ''; DB.walletSaved = '';
  render(true); renderSheet();
}
async function saveCatalog(cat){
  const doc = CATALOG[cat]; doc.cat = cat; doc.schema = 1;
  await DB.db.doc('catalog/' + cat).set(doc);
  rebuildCatalog();
}

/* ---- Roni AI (Claude through the `sample` capability) ---- */
const AI_RULES = `You are Roni, the friendly pug assistant inside the RONI app, a consumer insurance app in the United States. Today is Oct 11, 2026.
Answer the user's latest message using ONLY the DATA below. Rules:
1. A part with kind "policy" states facts that literally appear in DATA.policies. It MUST list "sources" that point to those facts: {"pid": policy id, "k": "i" (coverage item), "x" (exclusion) or "f" (key fact), "i": the index number shown in DATA}. Never invent limits, deductibles, dates, prices or coverage. If the policies do not say, say so plainly and suggest asking the carrier or uploading the relevant document.
2. kind "wallet" is for facts about the user's wallet overall (premiums, renewal dates, monitoring). No sources needed.
3. kind "general" is short, generic insurance education. Never claim it applies to the user's own policy.
4. Never call an option the universal best. Use DATA.needs (the user's own priorities, budget, deductible limit) and explain trade-offs. If you mention a sponsored option, say it is sponsored. Prices in DATA.catalog are illustrative estimates, not quotes.
5. You are not a lawyer, financial advisor or licensed agent. Do not give legal advice. Never ask for or repeat sensitive identifiers.
6. Warm, plain English, concise: at most 3 parts, at most 80 words each.
7. Offer at most 3 "actions" when useful. Allowed t values: "flow" (start a quote; needs c), "compare" (compare with current policy; needs c), "section" (open the policy section; needs c), "upload", "ask" (needs q, a follow-up question), "needs" (edit insurance needs), "profile" (edit profile). c must be one of auto, home, renters, life, health, pet.
Reply with ONLY JSON: {"parts":[{"kind":"policy|wallet|general","text":"...","list":["optional short bullets"],"sources":[{"pid":"auto","k":"i","i":2}]}],"actions":[{"t":"flow","c":"renters","label":"Start renters quote"}]}`;
function polForAI(p){
  return {pid:p.id, cat:p.cat, type:p.type, carrier:p.carrier, owner:p.owner === 'me' ? 'user' : p.owner, monthly:p.premium, renews:p.renewal, daysToRenewal:days(p.renewal), renewalQuote:p.renewalPremium || null, monitoring:p.monitoring,
    facts:p.facts.map((f,i)=>({i, label:f[0], value:sub(f[1]), page:f[2]})),
    items:p.items.map((it,i)=>({i, name:it.n, limit:it.lim, deductible:it.ded || null, page:it.pg, meaning:it.plain, quote:it.ex || null})),
    exclusions:p.excl.map((e,i)=>({i, text:e[0], page:e[1], quote:e[2] || null}))};
}
function aiContext(){
  const cat = {};
  CAT_KEYS.forEach(c => { cat[c] = (OPTIONS[c] || []).map(o=>({id:o.id, carrier:o.carrier, plan:o.plan || null, monthly:o.price, coverage:o.covText, deductible:o.ded, benefits:o.benefits, notIncluded:o.excl, sponsored:!!o.sponsored, status:o.status})); });
  return {
    user:{firstName:S.user.first, age:age(S.profile.dob) || null, zip:S.profile.zip || null, household:tok('household'), vehicles:S.profile.vehicles, pets:S.profile.pets},
    needs:S.needs, policies:S.policies.map(polForAI), foundByMonitoring:(WATCH.auto || []).map(o=>({carrier:o.carrier, monthly:o.price, coverage:o.covText, deductible:o.ded})), catalog:cat
  };
}
function cleanAI(o){
  const parts = [], actions = [], kinds = {policy:1, wallet:1, general:1}, cats = {auto:1, home:1, renters:1, life:1, health:1, pet:1};
  (Array.isArray(o && o.parts) ? o.parts : []).slice(0,4).forEach(pt => {
    if(!pt || typeof pt.text !== 'string' || !pt.text.trim()) return;
    let kind = kinds[pt.kind] ? pt.kind : 'general';
    const sources = [];
    (Array.isArray(pt.sources) ? pt.sources : []).slice(0,5).forEach(s => {
      const p = s && S.policies.find(x=>x.id === s.pid), i = s ? Number(s.i) : -1;
      if(!p || !Number.isInteger(i)) return;
      const arr = s.k === 'i' ? p.items : s.k === 'x' ? p.excl : s.k === 'f' ? p.facts : null;
      if(arr && arr[i]) sources.push({pid:p.id, k:s.k, i});
    });
    if(kind === 'policy' && !sources.length) kind = 'general'; // never label an unsupported claim as coming from the policy
    const list = Array.isArray(pt.list) ? pt.list.filter(x=>typeof x === 'string').slice(0,8).map(x=>x.slice(0,160)) : [];
    parts.push({kind, text:pt.text.slice(0,700), list:list.length ? list : null, sources});
  });
  (Array.isArray(o && o.actions) ? o.actions : []).slice(0,3).forEach(a => {
    if(!a || typeof a.label !== 'string') return;
    const t = a.t, label = a.label.slice(0,40);
    if(['flow','compare','section'].includes(t) && cats[a.c]) actions.push({t, c:a.c, label});
    else if(['upload','needs','profile'].includes(t)) actions.push({t, label});
    else if(t === 'ask' && typeof a.q === 'string' && a.q.trim()) actions.push({t, q:a.q.slice(0,120), label});
  });
  return {parts, actions};
}
async function askAI(q){
  const hist = S.chat.slice(0, -1).slice(-6).map(m => m.role === 'user' ? {role:'user', content:m.text} : {role:'assistant', content:m.parts.map(p=>p.text).join(' ').slice(0,600)});
  const turns = [{role:'user', content:AI_RULES + '\n\nDATA:\n' + JSON.stringify(aiContext())}].concat(hist, [{role:'user', content:q}]);
  S.ctl = new AbortController();
  const raw = await DB.sample.json(turns, {cache:false, signal:S.ctl.signal});
  const r = cleanAI(raw);
  if(!r.parts.length) throw {code:'invalid_json', message:'empty'};
  return r;
}

function chatMsg(m){

function collectProfile(){
  const g = id => { const e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : null; };
  const put = (obj, k, id) => { const v = g(id); if(v !== null) obj[k] = v.trim(); };
  put(S.user,'first','ep-first'); put(S.user,'last','ep-last'); put(S.user,'email','ep-email');
  ['dob','street','city','state','zip','income'].forEach(k => put(S.profile, k, 'ep-' + k));
  ['vehicles','properties','pets'].forEach(k => (S.profile[k] || []).forEach((_,i) => { const v = g(`ep-${k}-${i}`); if(v !== null) S.profile[k][i] = v.trim(); }));

function collectCat(s){
  const g = id => { const e = document.getElementById(id); return e && typeof e.value === 'string' ? e.value : null; };
  const o = s.o, sv = (k, id, f) => { const v = g(id); if(v !== null) o[k] = f ? f(v) : v.trim(); };
  sv('carrier','cp-carrier'); sv('plan','cp-plan'); sv('price','cp-price', v=>Number(v)||0); sv('cov','cp-cov', v=>Math.max(0,Math.min(100,Number(v)||0))); sv('ded','cp-ded', v=>Number(v)||0);
  sv('covText','cp-covText'); sv('benefits','cp-benefits', v=>v.split(';').map(x=>x.trim()).filter(Boolean)); sv('excl','cp-excl', v=>v.split(';').map(x=>x.trim()).filter(Boolean));
}
function normalizeOpt(x, cat){
  if(!x || typeof x.carrier !== 'string' || !x.carrier.trim() || !(Number(x.price) > 0)) return null;
  const arr = v => Array.isArray(v) ? v.map(String) : (typeof v === 'string' ? v.split(';').map(s=>s.trim()).filter(Boolean) : []);
  const modes = arr(x.modes).filter(m=>['roni','carrier','licensed'].includes(m));
  return {id:String(x.id || (cat + '-' + Math.random().toString(36).slice(2,8))), carrier:x.carrier.trim().slice(0,80), plan:x.plan ? String(x.plan).slice(0,60) : undefined,
    price:Number(x.price), cov:Math.max(0,Math.min(100,Number(x.cov) || 50)), covText:String(x.covText || '').slice(0,160), ded:Number(x.ded) || 0,
    benefits:arr(x.benefits).slice(0,8), excl:arr(x.excl).slice(0,8), modes:modes.length ? modes : ['carrier'], sponsored:!!x.sponsored,
    kind:x.kind === 'watch' ? 'watch' : 'quote', status:x.status === 'verified' ? 'verified' : 'illustrative', source:['fictional','manual','api'].includes(x.source) ? x.source : 'manual', updated:TODAY.toISOString().slice(0,10),
    attrs:Array.isArray(x.attrs) ? x.attrs : undefined};
}

    const p = S.policies.find(x=>x.id===s.pid); let title, pg, ex, plain = '', section;

/* ---------- Ask Roni engine (scripted for the prototype) ---------- */
function findCat(q){
  if(/\b(auto|car|cars|vehicle|driving)\b/.test(q)) return 'auto';
  if(/\b(renter|renters|apartment)\b/.test(q)) return 'renters';
  if(/\b(home|house|homeowner|homeowners)\b/.test(q)) return 'home';
  if(/\blife\b/.test(q)) return 'life';
  if(/\b(health|medical)\b/.test(q)) return 'health';
  if(/\b(pet|dog|cat|puppy|kitten)\b/.test(q)) return 'pet';
  return null;
}
function answerScripted(raw){
  const q = raw.toLowerCase().replace(/^\s*(hey\s+)?roni[,:]?\s*/, '').trim();
  const cat = findCat(q), auto = getP('auto');
  const missing = c => ({parts:[{kind:'general', text:`I don\u2019t see a ${CATS[c].label.toLowerCase()} policy in your Wallet yet. Upload it and I\u2019ll read it, explain it and answer questions with the exact page as the source.`}], actions:[{t:'upload',label:'Upload a policy'},{t:'flow',c,label:`Start ${CATS[c].label.toLowerCase()} quote`}]});

  if(/\b(stole|stolen|steal|steals|theft|thief)\b/.test(q)){
    if(!auto) return missing('auto');
    return {parts:[
      {kind:'policy', text:'Your uploaded policy includes Comprehensive Coverage with a $500 deductible.', sources:[{pid:'auto',k:'i',i:2}]},
      {kind:'general', text:'If the theft meets the policy conditions, comprehensive coverage generally applies.'},
      {kind:'policy', text:'One catch: personal belongings inside the car, like a laptop, are not covered by your auto policy.', sources:[{pid:'auto',k:'x',i:3}]}],
      actions:[{t:'section',label:'View policy section'},{t:'ask',q:'Explain my deductible',label:'Explain deductible'},{t:'compare',c:'auto',label:'Compare coverage'}]};
  }
  if(/deductible/.test(q)){
    const parts = [];
    if(cat === 'health' && getP('health')) parts.push({kind:'policy', text:'Your health plan has a $3,200 individual deductible and a $6,400 family deductible. Your yearly out-of-pocket limit is $8,500.', sources:[{pid:'health',k:'i',i:0},{pid:'health',k:'i',i:1}]});
    else if(auto){
      const src = [{pid:'auto',k:'i',i:1},{pid:'auto',k:'i',i:2}];
      if(getP('renters')) src.push({pid:'renters',k:'i',i:4});
      parts.push({kind:'policy', text:'Your auto policy has a $500 deductible for both Collision and Comprehensive.' + (getP('renters') ? ' Your renters policy also has a $500 deductible.' : ''), sources:src});
    }
    parts.push({kind:'general', text:'A deductible is what you pay first when you make a claim. Example: if a covered repair costs $2,300 and your deductible is $500, you pay $500 and your policy pays $1,800.'});
    return {parts, actions:[{t:'compare',c:'auto',label:'Compare coverage'}]};
  }
  if(/\b(renew|renews|renewal|renewing|expire|expires)\b/.test(q)){
    if(!S.policies.length) return missing('auto');
    const c = cat && getP(cat) ? cat : null;
    const list = c ? [getP(c)] : [...S.policies].sort((a,b)=>days(a.renewal)-days(b.renewal));
    const parts = [{kind:'wallet', text:'Here is what is coming up:', list:list.map(p=>`${p.type}${p.owner!=='me'?' ('+p.owner+')':''} renews ${fdate(p.renewal)}, in ${days(p.renewal)} days`)}];
    if(auto && list.includes(auto) && auto.renewalPremium) parts.push({kind:'policy', text:`Your carrier has quoted ${$$(auto.renewalPremium)}/month for the renewal, up ${$$(auto.renewalPremium-auto.premium)} from today.`, sources:[{pid:'auto',k:'f',i:3}]});
    return {parts, actions: auto && auto.renewalPremium && list.includes(auto) ? [{t:'compare',c:'auto',label:'Compare options'}] : []};
  }
  if(/expensive|why.*(cost|price|premium)|went up|increase|so high/.test(q)){
    if(!auto) return missing('auto');
    return {parts:[
      {kind:'policy', text:`You pay ${$$(auto.premium)}/month for ${auto.carrier} auto, and your renewal quote is ${$$(auto.renewalPremium)}/month, up ${$$(auto.renewalPremium-auto.premium)}.`, sources:[{pid:'auto',k:'f',i:4}]},
      {kind:'general', text:'Auto prices often rise because of higher repair and replacement costs, more claims in your area, changes to your driving record or coverage, or a carrier-wide rate increase. Comparing is the quickest way to see whether the increase is specific to your carrier.'}],
      actions:[{t:'compare',c:'auto',label:'Compare with my policy'}]};
  }
  if(/compare|similar|cheaper|less money|for less|save|savings|lower price|better deal|switch/.test(q)){
    const c = cat || 'auto', cur = getP(c);
    if(!cur) return missing(c);
    const sim = similarOptions(c);
    const parts = [{kind:'wallet', text:`Your ${cur.carrier} ${cur.type.toLowerCase()} costs ${$$(cur.premium)}/month.`}];
    if(sim.length) parts.push({kind:'general', text:`I found ${numWord(sim.length)} comparable option${sim.length===1?'':'s'} that cost${sim.length===1?'s':''} less, starting around ${$$(sim[0].price)}/month. These are estimates until you get a full quote, and I look at coverage as well as price.`});
    else parts.push({kind:'general', text:'I did not find a comparable option that costs less right now. I will keep watching.'});
    return {parts, actions:[{t:'compare',c,label:'Compare with my current policy'}]};
  }
  if(/\b(i|we)\s+(need|want|would like)\b|\b(i'm|i am|im)\s+looking\b|\b(get|find) me\b|\bquote\b|\bshop(ping)? for\b/.test(q) && cat){
    const l = CATS[cat].label.toLowerCase();
    if(CATS[cat].soon) return {parts:[{kind:'general', text:`${CATS[cat].label} insurance is coming soon to RONI. I can help with auto, home, renters, life, health and pet today.`}]};
    return {parts:[{kind:'general', text:'I can help with that.'}], actions:[{t:'flow',c:cat,label:`Start ${l} quote`}]};
  }
  if(/rental|roadside|tow|towing/.test(q)){
    if(!auto) return missing('auto');
    return {parts:[{kind:'policy', text:'Your auto policy includes rental reimbursement of $40 a day for up to 30 days after a covered claim, and roadside assistance for towing, battery, flat tires and lockouts.', sources:[{pid:'auto',k:'i',i:4},{pid:'auto',k:'i',i:5}]}]};
  }
  if(/cover|covered|coverage|protect|include|exclusion|exclude/.test(q)){
    const c = cat || 'auto', p = getP(c);
    if(!p) return missing(c);
    return {parts:[{kind:'policy', text:`Your ${p.carrier} ${p.type.toLowerCase()} policy includes:`, list:p.items.map(it=>`${it.n}: ${it.lim}`), sources:p.items.slice(0,3).map((_,i)=>({pid:p.id,k:'i',i}))},
      {kind:'general', text:'Tap a source to see exactly where in your policy this comes from.'}], actions:[{t:'section',c,label:'View policy section'}]};
  }
  if(cat === 'life' && !getP('life',false)){
    return {parts:[{kind:'wallet', text:'You do not have a life policy in your Wallet yet.'},{kind:'general', text:'A common starting point is several times your yearly income, but the right amount depends on debts, dependents and goals. Term life is usually the least expensive way to cover a set number of years.'}], actions:[{t:'flow',c:'life',label:'Start life quote'}]};
  }
  if(cat && getP(cat) && /policy|plan/.test(q)){
    const p = getP(cat);
    return {parts:[{kind:'policy', text:p.summary, sources:[{pid:p.id,k:'f',i:4}]}]};
  }
  if(/^(hi|hello|hey|help|thanks|thank you)\b/.test(q) || q.length < 3){
    return {parts:[{kind:'general', text:'I can explain your policies, tell you when things renew, compare options or start a quote. Try one of the suggestions below.'}]};
  }
  return {parts:[{kind:'general', text:'I am a prototype, so my answers are limited. I can help with coverage, deductibles, renewals, comparing options and starting a quote. Try \u201cIf someone steals my car tonight, am I covered?\u201d'}]};
}
function answerOption(cat, id){
  const o = findOpt(cat,id), cur = getP(cat), parts = [];
  parts.push({kind:'general', text:`${o.plan?o.plan+', ':''}${o.carrier}: ${$$(o.price)}/month with ${o.covText} and a ${o.ded?$$(o.ded):'$0'} deductible. Benefits: ${o.benefits.join(', ') || 'none listed'}. Not included: ${o.excl.slice(0,2).join('; ').toLowerCase()}.`});

async function sendChat(q, custom){

/* ---- real policy reading from a photo (Claude vision through `sample`) ---- */
const EXTRACT_PROMPT = `You are reading a photo of an insurance policy document for the RONI app. Extract ONLY what is visible. Use null when something is not visible; never guess. Quotes must be copied verbatim from the image and short (max 200 characters).
Reply with ONLY JSON: {"type":"Auto|Renters|Home|Life|Health|Pet|Other","carrier":"","policyNumber":"","policyholder":"","premiumMonthly":number|null,"effective":"YYYY-MM-DD"|null,"renewal":"YYYY-MM-DD"|null,"deductible":number|null,"label":"short description like the insured vehicle or address","covText":"one-line coverage summary","benefits":["..."],"items":[{"n":"coverage name","lim":"limit","ded":"deductible or None","page":"page or section if visible","plain":"one plain-English sentence","quote":"verbatim excerpt or null"}],"exclusions":[{"text":"","page":"","quote":null}],"summary":"2-3 plain-English sentences about what this policy means"}`;
async function extractPolicy(file){
  const raw = await DB.sample.json(EXTRACT_PROMPT, {images:file, cache:false});
  const key = String(raw && raw.type || '').toLowerCase();
  if(!CAT_KEYS.includes(key)) throw {code:'unknown_type', message:'Roni could not tell what type of policy this is. Try a clearer photo of the first page.'};
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null, date = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
  const warnings = [];
  const eff = date(raw.effective); let ren = date(raw.renewal);
  if(!ren){ ren = eff ? (Number(eff.slice(0,4)) + 1) + eff.slice(4) : '2027-10-11'; warnings.push('The renewal date was not visible, so Roni estimated it. Please check it.'); }
  const prem = num(raw.premiumMonthly); if(prem === null) warnings.push('The monthly price was not visible.');
  const holder = String(raw.policyholder || fullName());
  const facts = [['Policyholder',holder,'Photo'],['Policy number',String(raw.policyNumber || 'Not visible'),'Photo'],['Effective',eff ? fdate(eff) : 'Not visible','Photo'],['Renews',fdate(ren),'Photo'],['Premium',prem === null ? 'Not visible' : $$(prem) + ' per month','Photo']];
  const items = (Array.isArray(raw.items) ? raw.items : []).slice(0,12).filter(it=>it && it.n).map(it=>({n:String(it.n).slice(0,80), lim:String(it.lim || 'See policy').slice(0,160), ded:String(it.ded || ''), pg:String(it.page || 'Photo').slice(0,30), plain:String(it.plain || '').slice(0,240), ex:it.quote ? String(it.quote).slice(0,300) : undefined}));
  if(!items.length) throw {code:'no_items', message:'Roni could not find coverage details in that photo. Try a page that lists the coverages.'};
  const excl = (Array.isArray(raw.exclusions) ? raw.exclusions : []).slice(0,10).filter(e=>e && e.text).map(e=>[String(e.text).slice(0,160), String(e.page || 'Photo').slice(0,30), e.quote ? String(e.quote).slice(0,300) : undefined]);
  const ded = num(raw.deductible);
  return {cat:key, type:CATS[key].label, carrier:String(raw.carrier || 'Unknown carrier').slice(0,80), premium:prem || 0, renewal:ren, monitoring:true, score:60, ded:ded || 0, owner:'me',
    label:String(raw.label || CATS[key].label).slice(0,80), covText:String(raw.covText || '').slice(0,160), benefits:(Array.isArray(raw.benefits) ? raw.benefits : []).slice(0,6).map(String),
    attrs:ded !== null ? [['Deductible', $$(ded)]] : [], facts, items, excl, summary:String(raw.summary || 'Roni read this policy from your photo.').slice(0,600), aiExtracted:true, warnings};
}
async function handleFile(file){
  if(!file) return;
  const bad = msg => { S.sheet = {t:'upload', step:0, error:msg}; renderSheet(); };
  if(!DB.sample || !S.settings.ai) return bad('AI reading is turned off. You can turn it on in the Privacy center, or try a sample policy.');
  if(file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) return bad('Reading PDFs comes with the full version. For now, take or upload a photo of the policy pages, or try a sample policy.');
  const lim = await DB.sample.limits().catch(() => null);
  if(!lim || !lim.images) return bad('Photo reading is not available in this view. Try a sample policy instead.');
  S.sheet = {t:'upload', step:1, prog:0, pol:null}; renderSheet();
  const ticker = setInterval(() => { if(S.sheet && S.sheet.step === 1 && S.sheet.prog < 3){ S.sheet.prog++; renderSheet(); } }, 3500);
  try{
    const pol = await extractPolicy(file);
    clearInterval(ticker); S.sheet = {t:'upload', step:2, pol}; renderSheet();
  }catch(e){
    clearInterval(ticker);
    bad(e && e.code === 'unknown_type' || e && e.code === 'no_items' ? e.message : e && e.code === 'image_rejected' ? 'That file could not be used. Try a JPEG or PNG photo.' : e && e.code === 'rate_limited' ? 'Roni\u2019s AI is busy. Try again in a minute.' : 'Roni could not read that photo. Try a clearer, well-lit picture of the policy.');
  }
}

  results:() => {
    const c = S.flow.cat, f = FLOW[c] || {known:[]};
    f.known.forEach((k,i) => { if(!tok(k.token) && k.save){ const e = document.getElementById('kn-' + i); if(e && e.value) saveTok(k.save, e.value); } });

  needlvl:d => { need(d.c).level = d.v; render(); },

  additem:d => { collectProfile(); (S.profile[d.k] = S.profile[d.k] || []).push(''); render(); },
  rmitem:d => { collectProfile(); S.profile[d.k].splice(+d.i, 1); render(); },
  rmmember:d => { collectProfile(); S.members.splice(+d.i, 1); render(); },
  addmember:() => { if(S.screen === 'editprofile') collectProfile(); S.sheet = {t:'member', rel:'Child'}; renderSheet(); },
  saveprofile:() => {
    collectProfile(); if(!S.user.first) S.user.first = 'Alex';

    toast('Profile saved.'); go('profile');
  },
  stopai:() => { if(S.ctl) S.ctl.abort(); },
  chatact:d => {
    if(d.t === 'flow') startFlow(d.c);
    else if(d.t === 'compare') openCompare(d.c);
    else if(d.t === 'upload') H.upload();
    else if(d.t === 'ask') sendChat(d.q);

  catcat:d => { S.catAdmin = d.c; render(); },
  catadd:() => { S.sheet = {t:'catprod', cat:S.catAdmin, id:null, o:{carrier:'', plan:'', price:100, cov:60, covText:'', ded:500, benefits:[], excl:[], modes:['carrier'], kind:'quote', status:'illustrative', source:'manual', sponsored:false}}; renderSheet(); },
  catedit:d => { const o = ((CATALOG[S.catAdmin] || {}).options || []).find(x => x.id === d.id); if(!o) return; S.sheet = {t:'catprod', cat:S.catAdmin, id:o.id, o:clone(o)}; renderSheet(); },
  cpset:d => { const s = S.sheet; collectCat(s); if(d.k === 'sponsored') s.o.sponsored = !!d.v; else s.o[d.k] = d.v; renderSheet(); },
  cpmode:d => { const s = S.sheet; collectCat(s); const m = s.o.modes || (s.o.modes = []), i = m.indexOf(d.v); if(i > -1) m.splice(i,1); else m.push(d.v); renderSheet(); },
  catsave: async () => {
    const s = S.sheet; collectCat(s);
    const n = normalizeOpt(Object.assign({}, s.o, {id:s.id || undefined}), s.cat);
    if(!n){ toast('A carrier name and a price above zero are required.'); return; }
    const doc = CATALOG[s.cat] || (CATALOG[s.cat] = {cat:s.cat, options:[]});
    const i = doc.options.findIndex(x => x.id === n.id);
    if(i > -1) doc.options[i] = n; else doc.options.push(n);
    S.sheet = null; renderSheet();
    try{ await saveCatalog(s.cat); toast('Product saved to the database.'); }catch(e){ toast('Could not save to the database.'); }
    render();
  },
  catdelete: async () => {
    const s = S.sheet;
    if(!s.cd){ collectCat(s); s.cd = true; renderSheet(); toast('Tap delete again to confirm.'); return; }
    const doc = CATALOG[s.cat]; doc.options = doc.options.filter(x => x.id !== s.id);

    try{ await saveCatalog(s.cat); toast('Product deleted.'); }catch(e){ toast('Could not save to the database.'); }

    const s = S.sheet, t = document.getElementById('imp-text'); if(t) s.text = t.value;
    let data; try{ data = JSON.parse(s.text); }catch(e){ toast('That is not valid JSON.'); return; }
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.options) ? data.options : null);
    if(!list){ toast('Expected a list of products.'); return; }
    const norm = list.map(x => normalizeOpt(x, s.cat)).filter(Boolean);
    if(!norm.length){ toast('No valid products. Each needs a carrier and a price.'); return; }
    const doc = CATALOG[s.cat] || (CATALOG[s.cat] = {cat:s.cat, options:[]});
    if(s.replace) doc.options = norm; else norm.forEach(n => { const i = doc.options.findIndex(x => x.id === n.id); if(i > -1) doc.options[i] = n; else doc.options.push(n); });
    S.sheet = null; renderSheet();
    try{ await saveCatalog(s.cat); toast(norm.length + ' products imported.'); }catch(e){ toast('Could not save to the database.'); }
    render();
  },

    try{

    }catch(e){ toast('The file was not saved.'); }
  }
